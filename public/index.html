function build(){story.style.display=PG[mode]?'flex':'none';if(PG[mode]){bubbles.forEach(b=>b.el.remove());bubbles=[];PG[mode]();return}
 bubbles.forEach(b=>b.el.remove());bubbles=[];
 const all=mode==='letters'||mode==='flags';let items=sets[mode]();if(!all)items=items.slice(0,[8,12,16][age]);
 const W=S.clientWidth,H=S.clientHeight,size=all?Math.min(58,Math.floor(Math.sqrt(W*H/30))):Math.min([92,76,64][age],Math.floor(H/3.2));
 items.forEach((raw,i)=>{const [t,sp]=raw.split('|');

  el.addEventListener('pointerdown',e=>{b.drag=true;b.moved=0;b.ox=e.clientX-b.x;b.oy=e.clientY-b.y;el.setPointerCapture(e.pointerId);el.style.cursor='grabbing'});

 });

 setTimeout(()=>{b.x=Math.random()*(S.clientWidth-b.s);b.y=S.clientHeight-b.s;b.vy=-1;b.vx=(Math.random()-.5)*1.2;b.el.style.display='flex';b.el.classList.remove('in');void b.el.offsetWidth;b.el.classList.add('in');b.gone=false},1800)}
function loop(){
 const W=S.clientWidth,H=S.clientHeight;
 bubbles.forEach(b=>{
  if(b.gone)return;if(!b.drag){b.x+=b.vx;b.y+=b.vy;b.vx*=.995;b.vy*=.995;
   if(Math.abs(b.vx)<.25)b.vx+=(Math.random()-.5)*.05;if(Math.abs(b.vy)<.25)b.vy+=(Math.random()-.5)*.05;
   if(b.x<0||b.x>W-b.s){b.vx*=-1;b.x=Math.max(0,Math.min(W-b.s,b.x))}
   if(b.y<0||b.y>H-b.s){b.vy*=-1;b.y=Math.max(0,Math.min(H-b.s,b.y))}}
  b.ry+=(b.vx*14-b.ry)*.1;b.rx+=(-b.vy*14-b.rx)*.1;

 });
